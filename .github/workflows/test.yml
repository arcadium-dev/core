name: test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  test:
    strategy:
      matrix:
        go: [ '1.26.x' ]

    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: setup go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        check-latest: true

    - name: lint
      run: |
        make lint

    - name: test
      run: |
        make test
